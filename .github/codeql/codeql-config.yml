name: "CodeQL config"

# Bundle CP — query filters for findings that are false positives on
# this codebase. Each exclusion is justified inline; review before
# adding more.

queries:
  - uses: security-extended

paths-ignore:
  # Operator-run TypeScript scripts under scripts/ — never deployed to
  # the runtime, never reachable from a user request. CodeQL flags
  # network-data-on-file findings here that are real ("untrusted" data
  # ends up on disk) but the threat model doesn't apply: the operator
  # runs these locally against localhost:11434 (Ollama) or with a
  # DEEPL_API_KEY against deepl.com, both of which we trust by setup.
  # Excluded from analysis to keep the gate signal-rich.
  - "**/scripts/**"

query-filters:
  # `js/insufficient-password-hash` flags any use of a fast hash
  # (SHA-256, HMAC-SHA-256) on data that *could* be a password. We
  # use these patterns for:
  #   1. API key fingerprinting (192-bit random secret → SHA-256
  #      digest used as a DB lookup key). Stripe / GitHub pattern.
  #      Brute-forcing is computationally infeasible regardless of
  #      hash speed because of the input entropy.
  #   2. Audit-chain integrity (each row's `prevHash` chained via
  #      SHA-256). Tamper-evident logs, not passwords.
  #   3. Webhook signature verification (HMAC-SHA-256 — Stripe /
  #      GitHub / Slack standard).
  # Real password storage in the codebase uses bcryptjs via
  # `lib/philly/auth.ts:hashPassword()` and is unaffected by this
  # exclusion.
  - exclude:
      id: js/insufficient-password-hash
