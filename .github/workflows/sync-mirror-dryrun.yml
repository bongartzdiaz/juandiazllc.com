name: Sync mirror dryrun (audit:sync-mirror:fast)

# Enforces the "phily == DEUS-SHARED" invariant at PR time.
#
# Without this gate: a PR can add a file or pattern that breaks the
# rsync extraction in sync-deus-shared.yml (e.g., a symlink outside
# apps/philly-standalone/, a path that conflicts with the target repo's
# .git, a build artifact that shouldn't ship to the mirror). The break
# isn't discovered until the next manual / on-push sync, by which time
# the offending PR is already on main.
#
# With this gate: every PR touching apps/philly-standalone/ runs
# `audit:sync-mirror:fast` (~10s) which replays the rsync logic against
# a tmp directory and confirms the extracted tree builds standalone.
#
# Pairs with the auto-trigger added to sync-deus-shared.yml — together,
# they guarantee that anything on main can be safely synced to
# DEUS-SHARED on the next push.

on:
  push:
    branches: [main, claude/ai-command-bar]
  pull_request:
    branches: [main, claude/ai-command-bar]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dryrun:
    name: Replay rsync + structural check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/philly-standalone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/philly-standalone/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Run audit:sync-mirror:fast
        run: npm run audit:sync-mirror:fast
