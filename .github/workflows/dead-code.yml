name: Dead-code (knip)

# Bundle CO — surface unused files / exports / dependencies via knip.
# Flipped to `check:dead:strict` after the file count reached 0 in
# both root and standalone. Rules in each knip.json gate ONLY on
# unused-files and unused-binaries (the regression class that hurts);
# unused exports/types/deps stay warn-level (visible in CI logs but
# non-blocking) because cleaning the historical pile across 158+
# exported types in root + 197 in standalone is its own project.
#
# Complements the manual `git grep` cleanups that landed in
# bundles BO/AY/AN by catching regressions automatically.

on:
  # Also run against claude/ai-command-bar — the long-running feature
  # branch where session work lands. Without this, regressions in any
  # of these gates would only surface after PR #10 merges into main,
  # by which point they've accumulated. Reverting back to main-only
  # is one commit if CI minutes become a concern.
  push:
    branches: [main, claude/ai-command-bar]
  pull_request:
    branches: [main, claude/ai-command-bar]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knip-root:
    name: knip (root)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install deps
        run: npm ci
      - name: Knip
        run: npm run check:dead:strict

  knip-standalone:
    name: knip (apps/philly-standalone)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/philly-standalone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install deps
        run: npm ci
      - name: Knip
        run: npm run check:dead:strict
