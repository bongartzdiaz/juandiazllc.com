name: Dead-code (knip)

# Bundle CO — surface unused files / exports / dependencies via knip.
# Runs in --no-exit-code mode for now so existing dead code (~16
# files + 3 deps in root, similar in standalone) doesn't block PRs.
# Once we clean the pile, flip both jobs to `check:dead:strict` to
# enforce zero new findings.
#
# Complements the manual `git grep` cleanups that landed in
# bundles BO/AY/AN by catching regressions automatically.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knip-root:
    name: knip (root)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install deps
        run: npm ci
      - name: Knip
        run: npm run check:dead

  knip-standalone:
    name: knip (apps/philly-standalone)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/philly-standalone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install deps
        run: npm ci
      - name: Knip
        run: npm run check:dead
