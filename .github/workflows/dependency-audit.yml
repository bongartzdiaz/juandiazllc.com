name: Dependency-audit

# Poort op npm audit, met uitzonderingen die verlopen.
# Zie security/geaccepteerde-advisories.json en lib/security/audit-gate.ts.
#
# Eigen workflow en niet in ci.yml, om één reden: dit moet ook draaien zónder
# dat er een pull request langskomt. Een vervaldatum die alleen bij de
# volgende PR afgaat is geen datum. Een `schedule` in ci.yml zou daarnaast
# typecheck, test, i18n en tenant-scope elke nacht meetrekken zonder dat daar
# iets aan verandert.
#
# Ook nuttig zonder codewijziging: een advisory kan verschijnen voor een
# pakket dat al maanden stilstaat. Dependabot meldt dat wel, maar een melding
# in een tabblad is geen poort — deze job faalt.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 05:00 UTC, een uur voor de SEO-audit, zodat de twee meldingen niet
    # tegelijk binnenkomen.
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: deps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # De poort leest de lockfile (`npm audit --package-lock-only`) en heeft
      # dus geen build nodig.
      - name: npm-audit-poort
        run: npm run audit:deps

      # Tweede poort, andere vraag. De eerste vraagt of er een bekende
      # kwetsbaarheid in zit; deze vraagt of de tarballs zijn wat de registry
      # zegt dat ze zijn. Een gekaapt maintaineraccount publiceert een pakket
      # dat geldig ondertekend is en dus hier doorkomt — maar een tarball die
      # onderweg is vervangen, of een registry-mirror die iets anders serveert,
      # niet. Gemeten op 2026-09-04: 453 van de 453 pakketten hebben een
      # geverifieerde handtekening, 115 een attestatie. Vastzetten kost dus
      # niets en de poort begint groen.
      #
      # Let op bij een rood vinkje hier: deze stap belt de registry, dus een
      # storing daar geeft ook rood. Lees de melding voordat je concludeert
      # dat er is geknoeid. Fail-open maken is geen optie — een
      # handtekeningcontrole die zichzelf overslaat controleert niets.
      - name: handtekening-poort
        run: npm audit signatures
