name: Lighthouse CI

# Runs Lighthouse against the production deployment on main. We used to
# also run against the PR preview, but Vercel Preview Protection puts
# previews behind an auth wall — the Lighthouse runner hits the login
# page and times out. Running only against production avoids the false
# failures while still gating on regressions before the next release.
#
# Uses treosh/lighthouse-ci-action which handles LHCI server-less
# (uploads to temporary-public-storage so we get a URL to inspect).
# No LHCI server required.

on:
  push:
    branches: [main]
  # Manual trigger for ad-hoc runs.
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    # Wait for Vercel to finish deploying production before we audit.
    # We give Vercel up to 10 minutes to land the build.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Wait for Vercel deployment
        id: vercel
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600
          environment: Production

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ steps.vercel.outputs.url }}
            ${{ steps.vercel.outputs.url }}/insights
            ${{ steps.vercel.outputs.url }}/work
            ${{ steps.vercel.outputs.url }}/about
            ${{ steps.vercel.outputs.url }}/contact
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
