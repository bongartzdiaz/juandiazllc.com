name: Sentry release + source maps

# When a commit lands on main, create a Sentry release tagged with the
# commit SHA, upload source maps, and finalise the release. Without
# this, prod stack traces show minified gibberish.
#
# ─────────────────────────────────────────────────────────────────
# IMPORTANT — known trade-off (Bundle BJ audit finding #9):
# ─────────────────────────────────────────────────────────────────
# This workflow builds the bundle on the GH-hosted runner and uploads
# THOSE source maps. Vercel runs its own build to deploy production,
# so bundle hashes can drift between this run and Vercel's. A frame
# in a real prod stack trace might reference `chunks/abc123.js` but
# this run uploaded `chunks/def456.js` — Sentry's frame matching then
# fails silently and the trace stays minified.
#
# RECOMMENDED — use Vercel's native Sentry integration instead.
# It runs source-map upload in the same build that produces the
# deployed artifact, so hashes always match. Setup is one click:
#
#   vercel.com/integrations/sentry → Add → pick the project →
#   sign in to your Sentry org → done.
#
# After installing the Vercel integration, DISABLE this workflow
# (rename to `.disabled` or delete) — running both will create
# duplicate releases.
#
# Keep this file as a fallback for non-Vercel deploys (self-hosted,
# Render, Cloudflare Pages, etc.) where a marketplace integration
# isn't available.
# ─────────────────────────────────────────────────────────────────
#
# Operator setup (one-time, fallback path):
#   - SENTRY_AUTH_TOKEN  → GitHub repo secret. Sentry → User Settings →
#     Auth Tokens; needs project:releases scope.
#   - SENTRY_ORG         → GitHub repo variable (your Sentry org slug).
#   - SENTRY_PROJECT     → GitHub repo variable (your Sentry project slug).
#
# When SENTRY_ORG / SENTRY_PROJECT variables are unset the workflow
# short-circuits at the job-level if-gate, so it stays dormant until
# the operator wires it.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sentry-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' }}

    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      # Sentry release tag = the commit SHA. Mirrors what the runtime
      # uses for SENTRY_RELEASE / NEXT_PUBLIC_SENTRY_RELEASE so events
      # land in the right release group.
      SENTRY_RELEASE: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build (root marketing site)
        run: npm run build
        env:
          # Force source maps for upload. Next.js by default omits
          # them from production for footprint reasons.
          NEXT_PRIVATE_PROD_SOURCEMAPS: "true"

      - name: Build (philly-standalone)
        run: |
          cd apps/philly-standalone
          npm ci
          npm run build
        env:
          NEXT_PRIVATE_PROD_SOURCEMAPS: "true"

      - name: Install Sentry CLI
        run: npm install --no-save @sentry/cli

      - name: Create release
        run: npx sentry-cli releases new "$SENTRY_RELEASE"

      - name: Upload source maps — root
        run: |
          npx sentry-cli sourcemaps upload \
            --release "$SENTRY_RELEASE" \
            --strip-prefix "$(pwd)" \
            --url-prefix "~/_next" \
            .next

      - name: Upload source maps — standalone
        run: |
          cd apps/philly-standalone
          npx sentry-cli sourcemaps upload \
            --release "$SENTRY_RELEASE" \
            --strip-prefix "$(pwd)" \
            --url-prefix "~/_next" \
            .next

      - name: Associate commits
        run: npx sentry-cli releases set-commits "$SENTRY_RELEASE" --auto

      - name: Finalise release
        run: npx sentry-cli releases finalize "$SENTRY_RELEASE"
