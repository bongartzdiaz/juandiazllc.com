name: Calendar channel renewal (hourly)

# Losse workflow van retention-daily, met opzet: dit is geen AVG-verplichting
# maar een functionele. Google-watch-kanalen verlopen na 7 dagen, Microsoft-
# subscriptions na ~70 uur. Zonder verlenging stopt push-sync stil — de
# kalender lijkt te werken maar loopt achter.
#
# Uurlijks omdat MANUAL_TASKS.md dat voorschrijft; de renewal-selector pakt
# alleen kanalen die binnen 12 uur verlopen, dus de meeste runs doen niets en
# zijn goedkoop.
#
# Vereist hetzelfde CRON_SECRET repo-secret als retention-daily.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: calendar-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Renew calendar channels
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://juandiazllc.com' }}
        run: |
          set -uo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error title=Missing secret::CRON_SECRET repo-secret niet gezet — push-sync verloopt stil."
            exit 1
          fi

          body=$(curl -sS -X POST "${SITE_URL}/philly/api/calendar/cron/renew-channels" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            -H 'Content-Type: application/json' \
            -w '\n%{http_code}' \
            --max-time 120) || { echo "::error::curl faalde"; exit 1; }

          status=$(printf '%s' "$body" | tail -n1)
          body=$(printf '%s' "$body" | sed '$d')

          if [ "$status" != "200" ]; then
            echo "::error title=Renewal faalde::HTTP ${status} — ${body}"
            exit 1
          fi
          echo "ok: ${body}"
