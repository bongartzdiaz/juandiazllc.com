name: Sync to DEUS-SHARED

# Mirrors this repo to bongartzdiaz/DEUS-SHARED on every push to main.
# The mirror exists for downstream distribution — collaborator access,
# alternative deploy pipeline, partner builds. Source of truth stays here.
#
# Setup is operator-side and one-time. See MANUAL_TASKS.md → "DEUS-SHARED
# mirror setup" for the steps (create target repo, generate fine-grained
# PAT, set the secret, run once manually to verify).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you re-running the mirror sync?"
        required: false
        default: "manual sync"

# Don't overlap pushes — each run pushes the full ref set, and a parallel
# job would race on the remote. Queue them; cancel-in-progress: false so
# we don't drop a sync that already started.
concurrency:
  group: deus-shared-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check secret
        run: |
          if [ -z "${{ secrets.DEUS_SHARED_PAT }}" ]; then
            echo "::error::DEUS_SHARED_PAT secret is not set. See MANUAL_TASKS.md → 'DEUS-SHARED mirror setup'."
            exit 1
          fi

      - name: Checkout source repo (full history + all branches/tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Bare-clone style — we want every ref so --mirror pushes them all.
          fetch-tags: true

      - name: Push mirror to DEUS-SHARED
        env:
          PAT: ${{ secrets.DEUS_SHARED_PAT }}
          TARGET_REPO: bongartzdiaz/DEUS-SHARED
        run: |
          set -euo pipefail
          # Use the PAT as the password for the temporary remote URL.
          # The PAT never lands on disk and is masked in logs by GitHub.
          git remote add deus-shared "https://x-access-token:${PAT}@github.com/${TARGET_REPO}.git"
          # --mirror pushes every ref (branches, tags) and force-overwrites
          # the target. DEUS-SHARED is a replica, not a fork, so this is
          # the desired semantic. Don't add --no-force here — partial mirrors
          # leave the target inconsistent.
          git push --mirror deus-shared
          # Strip the credential URL even on early-exit paths (set -e covers
          # success; trap handles failures).
          git remote remove deus-shared || true
