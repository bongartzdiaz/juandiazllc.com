name: CI

# Pre-merge quality gate (A-09). Runs on every pull request and on
# pushes to main. Blocks regressions — type errors or failing tests —
# from reaching production, since merge-to-main auto-deploys via Vercel.
#
# Branch protection op `main` staat sinds 2026-08-19 aan, dus dit is een
# poort en geen rapportage meer. Verplicht zijn: typecheck, test, i18n,
# audit en deps. `tenant-scope` stond hier ooit genoemd maar bestaat niet
# meer — die verdween met het CRM (#134-#140).
#
# Twee checks zijn bewust NIET verplicht. `audit-productie` draait op elke
# PR maar wordt altijd overgeslagen, en een check die nooit rapporteert laat
# een PR op "expected" hangen in plaats van rood te worden. `Vercel` deployt
# pas na de merge, dus een hapering daar zou merges blokkeren zonder defect.
#
# Voeg je hier een job toe die verplicht moet worden, zet hem dan pas in de
# branch-protection-lijst nadat je hem op een echte PR groen hebt zien komen.
# Een naam die nooit verschijnt blokkeert elke merge, stil.
#
# Note: `npm run lint` is intentionally NOT gated — `next lint` was
# removed in Next.js 16 and the script currently no-ops/errors. Migrate
# it to the ESLint CLI, then add a lint job here. (Follow-up.)
#
# Node 24: package-lock.json is generated with npm 11 (Node 24). `npm ci`
# on Node 22 (npm 10) rejects the lockfile ("Missing magicast/@swc/helpers
# from lock file") because the two npm majors compute the tree differently.
# Pin to 24 so `npm ci` uses the npm that produced the lock. (Vercel uses
# the lenient `npm install` so its build is unaffected.)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test (vitest)
        run: npm test -- --run

  # i18n-pariteit. translate() valt stil terug op Engels wanneer een sleutel
  # ontbreekt, dus een vergeten vertaling levert geen foutmelding en geen lege
  # plek op — maar keurige Engelse tekst op een Nederlandse pagina. Dat ziet er
  # werkend uit en haalt daarom elke handmatige controle en elke code review.
  #
  # Bewust GEEN `npm ci`: het script gebruikt alleen node:fs/path/url en leest
  # één bestand. Installeren zou de job van seconden naar minuten trekken zonder
  # iets toe te voegen.
  i18n:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: i18n-sleutelpariteit (en/nl/de/es)
        run: node scripts/check-i18n-parity.mjs

  # AGENTS.md en CLAUDE.md moeten byte-identiek zijn. Verschillende harnassen
  # lezen verschillende bestanden: sommige alleen AGENTS.md, andere alleen
  # CLAUDE.md. Lopen ze uiteen, dan krijgt de helft van de tooling verouderde
  # projectkennis — en dat merk je niet, want beide bestanden zien er prima uit.
  #
  # Dat was geen theorie: tot 2026-08-19 beschreef AGENTS.md het Philly-CRM en
  # een SLO-sectie die in #134-#140 uit deze repo verwijderd zijn.
  #
  # Wijzig je er één, kopieer hem dan over de ander heen: `cp CLAUDE.md AGENTS.md`.
  docs-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: AGENTS.md is gelijk aan CLAUDE.md
        run: |
          if ! diff -u CLAUDE.md AGENTS.md; then
            echo "::error::AGENTS.md en CLAUDE.md lopen uiteen. Draai: cp CLAUDE.md AGENTS.md"
            exit 1
          fi
