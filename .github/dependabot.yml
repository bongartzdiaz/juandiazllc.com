version: 2
updates:
  # npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # Safe minor/patch updates bundled together
      safe-updates:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - 'next'
          - '@prisma/*'
          - 'prisma'
          - 'react'
          - 'react-dom'
          - 'next-auth'
      # Framework bumps reviewed individually
      framework:
        patterns:
          - 'next'
          - '@prisma/*'
          - 'prisma'
          - 'react'
          - 'react-dom'
          - 'next-auth'
    ignore:
      # Major framework bumps are manual decisions
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react*'
        update-types: ['version-update:semver-major']

  # GitHub Actions workflow dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github-actions

  # Docker base image
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docker
