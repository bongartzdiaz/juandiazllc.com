<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none" aria-label="Juan Diaz, LLC">
  <!-- Fixed origin beam — structural reference -->
  <line x1="30" y1="8" x2="66" y2="8" stroke="currentColor" stroke-width="1.4" opacity="0.5" stroke-linecap="round"/>
  <line x1="22" y1="8" x2="26" y2="8" stroke="currentColor" stroke-width="1.4" opacity="0.35" stroke-linecap="round"/>
  <line x1="70" y1="8" x2="74" y2="8" stroke="currentColor" stroke-width="1.4" opacity="0.35" stroke-linecap="round"/>

  <!-- Suspension anchor -->
  <circle cx="48" cy="8" r="3.4" fill="currentColor"/>

  <!-- Pendulum group (cord + bob) — animatable as one unit -->
  <g transform-origin="48px 8px">
    <!-- Tension cord -->
    <line x1="48" y1="14" x2="48" y2="50" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Plumb-bob — classic teardrop (construction silhouette) -->
    <path d="M 48 50 Q 30 50 30 64 L 48 86 L 66 64 Q 66 50 48 50 Z M 51 64 a 3 3 0 1 0 -6 0 a 3 3 0 1 0 6 0 Z" fill="currentColor" fill-rule="evenodd"/>
  </g>

  <!-- Horizon — level reference at bob's center of mass -->
  <line x1="6" y1="64" x2="22" y2="64" stroke="currentColor" stroke-width="1.1" opacity="0.4" stroke-linecap="round"/>
  <line x1="74" y1="64" x2="90" y2="64" stroke="currentColor" stroke-width="1.1" opacity="0.4" stroke-linecap="round"/>

  <!-- Swing-arc reference (faint, dashed) -->
  <path d="M 22 70 A 40 40 0 0 1 74 70" fill="none" stroke="currentColor" stroke-width="0.7" stroke-dasharray="1 4" opacity="0.3"/>
</svg>
