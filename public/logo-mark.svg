<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" aria-label="Juan Diaz LLC">
  <!-- Outer precision bezel -->
  <circle cx="40" cy="40" r="36.5" stroke="currentColor" stroke-width="0.7" stroke-dasharray="1 4" opacity="0.4" />

  <!-- Corner viewfinder brackets -->
  <g stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
    <path d="M 8 14 L 8 8 L 14 8" />
    <path d="M 72 14 L 72 8 L 66 8" />
    <path d="M 8 66 L 8 72 L 14 72" />
    <path d="M 72 66 L 72 72 L 66 72" />
  </g>

  <!-- Cardinal calibration ticks -->
  <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity="0.55">
    <line x1="40" y1="3" x2="40" y2="7" />
    <line x1="40" y1="73" x2="40" y2="77" />
    <line x1="3" y1="40" x2="7" y2="40" />
    <line x1="73" y1="40" x2="77" y2="40" />
  </g>

  <!-- The J — primary gesture -->
  <g stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="54" y1="28" x2="54" y2="48" />
    <path d="M 54 48 C 54 63, 40 67, 27 65.5 C 16 64, 11 56, 11 48" />
  </g>
  <circle cx="54" cy="14" r="3.8" fill="currentColor" />

  <!-- Target-acquired terminus -->
  <circle cx="11" cy="48" r="1.6" fill="currentColor" opacity="0.7" />
</svg>
